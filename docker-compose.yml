services:
  db:
    image: pgvector/pgvector:pg16
    container_name: statiq_db
    environment:
      POSTGRES_USER: statiq_user
      POSTGRES_PASSWORD: statiq_password
      POSTGRES_DB: statiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: always

volumes:
  pgvector-data:
